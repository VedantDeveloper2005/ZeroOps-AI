# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zeroopsai

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: zeroops-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend Semgrep SAST
        run: |
          python3 -m pip install --disable-pip-version-check semgrep==1.164.0
          semgrep scan --config p/typescript --error --metrics=off src

      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            --output "${RUNNER_TEMP}/gitleaks-checksums.txt"
          cd "${RUNNER_TEMP}"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks-checksums.txt | sha256sum --check --strict
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          chmod 0755 gitleaks

      - name: Scan committed secrets
        run: "${RUNNER_TEMP}/gitleaks git --redact --exit-code 1 ."

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Test homepage content contract
        run: npm run test:homepage

      - name: Test desktop-only device gate
        run: npm run test:device-gate

      - name: Validate backend rewrite target
        env:
          ZEROOPS_BACKEND_URL: ${{ vars.ZEROOPS_BACKEND_URL || 'https://zeroops-backend.azurewebsites.net' }}
        run: |
          test -n "$ZEROOPS_BACKEND_URL"
          case "$ZEROOPS_BACKEND_URL" in
            https://*) ;;
            *) echo "ZEROOPS_BACKEND_URL must be an HTTPS origin." >&2; exit 1 ;;
          esac

      - name: Build frontend
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
          ZEROOPS_BACKEND_URL: ${{ vars.ZEROOPS_BACKEND_URL || 'https://zeroops-backend.azurewebsites.net' }}
        run: npm run build

      - name: Prepare deployment artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p .next/standalone/.next/
          cp -R public .next/standalone/
          cp -R .next/static .next/standalone/.next/

      - name: Upload artifact for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-app
          path: .next/standalone
          include-hidden-files: true


  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: node-app
          path: .
      
      - name: Login to Azure
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || secrets.AZUREAPPSERVICE_CLIENTID_1D49659F5B5345268A7FCB8EFD04FA52 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || secrets.AZUREAPPSERVICE_TENANTID_E6673234A5024B008E866F7F2B0F07E9 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BC200405435F4679AAE56FA9C421C8B9 }}



      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: 'zeroopsai'
          slot-name: 'Production'
          package: .
          startup-command: 'node server.js'

      - name: Verify deployed frontend response
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 --output /dev/null \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) ZeroOpsReleaseCheck/1.0" \
              https://zeroopsai.azurewebsites.net/; then
              exit 0
            fi
            echo "Frontend response check ${attempt}/30 failed; retrying in 5 seconds"
            sleep 5
          done
          echo "Frontend did not return a successful response after deployment" >&2
          exit 1
