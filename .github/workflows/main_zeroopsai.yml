# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zeroopsai

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Type-check frontend
        run: npm run typecheck

      - name: Validate backend rewrite target
        env:
          ZEROOPS_BACKEND_URL: ${{ vars.ZEROOPS_BACKEND_URL }}
        run: |
          test -n "$ZEROOPS_BACKEND_URL"
          case "$ZEROOPS_BACKEND_URL" in
            https://*) ;;
            *) echo "ZEROOPS_BACKEND_URL must be an HTTPS origin." >&2; exit 1 ;;
          esac

      - name: Build frontend
        env:
          DEPLOYMENT_VERSION: ${{ github.sha }}
          ZEROOPS_BACKEND_URL: ${{ vars.ZEROOPS_BACKEND_URL }}
        run: npm run build

      - name: Prepare deployment artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p .next/standalone/.next/
          cp -R public .next/standalone/
          cp -R .next/static .next/standalone/.next/

      - name: Upload artifact for deployment job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone
          include-hidden-files: true


  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || secrets.AZUREAPPSERVICE_CLIENTID_1D49659F5B5345268A7FCB8EFD04FA52 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || secrets.AZUREAPPSERVICE_TENANTID_E6673234A5024B008E866F7F2B0F07E9 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BC200405435F4679AAE56FA9C421C8B9 }}



      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'zeroopsai'
          slot-name: 'Production'
          package: .
          startup-command: 'node server.js'
