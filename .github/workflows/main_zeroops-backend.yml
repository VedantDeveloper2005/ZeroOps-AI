# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Python app to Azure Web App - zeroops-backend

# Terraform execution is intentionally absent from this App Service workflow.
# The isolated VMSS runner is built and validated by platform-ci.yml and rolled
# out only through the separately approved infrastructure process.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: zeroops-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --strict --requirement backend/requirements.txt

      - name: Run Semgrep SAST
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.164.0
          semgrep scan --config p/default --error --metrics=off backend worker functions

      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${RUNNER_TEMP}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            --output "${RUNNER_TEMP}/gitleaks-checksums.txt"
          cd "${RUNNER_TEMP}"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks-checksums.txt | sha256sum --check --strict
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          chmod 0755 gitleaks

      - name: Scan committed secrets
        run: "${RUNNER_TEMP}/gitleaks git --redact --exit-code 1 ."

      - name: Install verified Trivy
        env:
          TRIVY_VERSION: '0.73.0'
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "${RUNNER_TEMP}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt" \
            --output "${RUNNER_TEMP}/trivy-checksums.txt"
          cd "${RUNNER_TEMP}"
          grep "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy-checksums.txt | sha256sum --check --strict
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          chmod 0755 trivy

      - name: Scan backend runtime dependencies and configuration
        run: |
          # Terraform is validated with the production tfvars in platform-ci;
          # this App Service workflow scans only the code it packages or runs.
          for target in backend worker functions; do
            "${RUNNER_TEMP}/trivy" fs \
              --scanners vuln,misconfig \
              --severity CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              "$target"
          done

  build:
    runs-on: ubuntu-latest
    needs: security
    timeout-minutes: 25
    env:
      APP_ENV: test

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Keep CI aligned with the App Service runtime.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m venv .venv-ci
          source .venv-ci/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==9.0.3 pytest-asyncio==1.3.0

      - name: Test backend
        run: |
          source .venv-ci/bin/activate
          python -m pip check
          python -m pytest backend/tests

      - name: Build App Service deployment package
        run: |
          source .venv-ci/bin/activate
          python scripts/package_appservice_backend.py

      - name: Upload backend artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-backend-app
          path: dist/zeroops-backend-appservice.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: github.event_name != 'pull_request'
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-backend-app
          path: dist

      - name: Azure Login
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || secrets.AZUREAPPSERVICE_CLIENTID_60ACB2A90AD54CD4964DB63073AEB479 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || secrets.AZUREAPPSERVICE_TENANTID_60AE222B23A4498E8C8D8B1406983EC2 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_16E28753469340139CFF339C6075F2D0 }}



      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@b686016b4de8820a23519503685d8d03fbfa03a6 # v3
        with:
          app-name: 'zeroops-backend'
          slot-name: 'Production'
          package: dist/zeroops-backend-appservice.zip

      - name: Verify deployed backend health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 --output /dev/null \
              https://zeroops-backend.azurewebsites.net/health; then
              exit 0
            fi
            echo "Health check attempt ${attempt}/30 failed; retrying in 5 seconds"
            sleep 5
          done
          echo "Backend did not become healthy after deployment" >&2
          exit 1
