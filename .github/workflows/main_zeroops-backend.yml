# Docs for the Azure Web Apps Deploy action:
# https://github.com/Azure/webapps-deploy

name: Build and deploy Python app to Azure Web App - zeroops-backend

# Worker deployment prerequisites (configured as GitHub repository variables):
# - AZURE_WORKER_ACR_NAME: an existing ACR that the deployment identity can build in.
# - AZURE_WORKER_CONTAINER_APP_NAME: an existing Container App with no public ingress.
# - AZURE_WORKER_RESOURCE_GROUP: the resource group containing both resources.
# The Container App must use a managed identity with ACR pull and Key Vault read
# access. Its environment must contain APP_ENV=production and
# AZURE_KEYVAULT_URL=https://<vault>.vault.azure.net/. Configure an HTTP
# readiness probe for /ready on port 8085. The workflow intentionally fails
# when any prerequisite is absent; it never silently skips the queue worker.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m venv .venv-ci
          source .venv-ci/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==9.0.3 pytest-asyncio==1.3.0

      - name: Test backend
        run: |
          source .venv-ci/bin/activate
          python -m pip check
          python -m pytest backend/tests

      - name: Upload backend artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: python-backend-app
          path: backend/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: python-backend-app
          path: .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || secrets.AZUREAPPSERVICE_CLIENTID_60ACB2A90AD54CD4964DB63073AEB479 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || secrets.AZUREAPPSERVICE_TENANTID_60AE222B23A4498E8C8D8B1406983EC2 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_16E28753469340139CFF339C6075F2D0 }}



      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'zeroops-backend'
          slot-name: 'Production'
          package: .

  deploy-worker:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    permissions:
      id-token: write
      contents: read

    env:
      WORKER_ACR_NAME: ${{ vars.AZURE_WORKER_ACR_NAME }}
      WORKER_CONTAINER_APP_NAME: ${{ vars.AZURE_WORKER_CONTAINER_APP_NAME }}
      WORKER_RESOURCE_GROUP: ${{ vars.AZURE_WORKER_RESOURCE_GROUP }}
      WORKER_IMAGE_REPOSITORY: zeroops-worker

    steps:
      - name: Checkout exact worker source
        uses: actions/checkout@v4

      - name: Validate worker deployment configuration
        shell: bash
        run: |
          : "${WORKER_ACR_NAME:?Set repository variable AZURE_WORKER_ACR_NAME.}"
          : "${WORKER_CONTAINER_APP_NAME:?Set repository variable AZURE_WORKER_CONTAINER_APP_NAME.}"
          : "${WORKER_RESOURCE_GROUP:?Set repository variable AZURE_WORKER_RESOURCE_GROUP.}"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || secrets.AZUREAPPSERVICE_CLIENTID_60ACB2A90AD54CD4964DB63073AEB479 }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || secrets.AZUREAPPSERVICE_TENANTID_60AE222B23A4498E8C8D8B1406983EC2 }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_16E28753469340139CFF339C6075F2D0 }}

      - name: Validate existing isolated worker
        shell: bash
        run: |
          az extension add --name containerapp --upgrade --yes
          az acr show \
            --name "$WORKER_ACR_NAME" \
            --resource-group "$WORKER_RESOURCE_GROUP" \
            --only-show-errors \
            --output none
          az containerapp show \
            --name "$WORKER_CONTAINER_APP_NAME" \
            --resource-group "$WORKER_RESOURCE_GROUP" \
            --only-show-errors \
            --output none

          app_env="$(
            az containerapp show \
              --name "$WORKER_CONTAINER_APP_NAME" \
              --resource-group "$WORKER_RESOURCE_GROUP" \
              --query "properties.template.containers[0].env[?name=='APP_ENV'].value | [0]" \
              --output tsv
          )"
          key_vault_url="$(
            az containerapp show \
              --name "$WORKER_CONTAINER_APP_NAME" \
              --resource-group "$WORKER_RESOURCE_GROUP" \
              --query "properties.template.containers[0].env[?name=='AZURE_KEYVAULT_URL'].value | [0]" \
              --output tsv
          )"
          if [[ "$app_env" != "production" ]]; then
            echo "::error::Worker Container App must set APP_ENV=production."
            exit 1
          fi
          if [[ ! "$key_vault_url" =~ ^https://[^/]+\.vault\.azure\.net/?$ ]]; then
            echo "::error::Worker Container App must set a valid AZURE_KEYVAULT_URL."
            exit 1
          fi

      - name: Build immutable worker image in ACR
        shell: bash
        run: |
          mkdir .worker-build-context
          cp -R backend worker .worker-build-context/
          az acr build \
            --registry "$WORKER_ACR_NAME" \
            --resource-group "$WORKER_RESOURCE_GROUP" \
            --image "${WORKER_IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --file .worker-build-context/worker/Dockerfile \
            .worker-build-context \
            --only-show-errors

      - name: Deploy and start worker revision
        shell: bash
        run: |
          login_server="$(
            az acr show \
              --name "$WORKER_ACR_NAME" \
              --resource-group "$WORKER_RESOURCE_GROUP" \
              --query loginServer \
              --output tsv
          )"
          image="${login_server}/${WORKER_IMAGE_REPOSITORY}:${GITHUB_SHA}"
          az containerapp update \
            --name "$WORKER_CONTAINER_APP_NAME" \
            --resource-group "$WORKER_RESOURCE_GROUP" \
            --image "$image" \
            --min-replicas 1 \
            --max-replicas 1 \
            --only-show-errors \
            --output none

          provisioning_state="$(
            az containerapp show \
              --name "$WORKER_CONTAINER_APP_NAME" \
              --resource-group "$WORKER_RESOURCE_GROUP" \
              --query properties.provisioningState \
              --output tsv
          )"
          latest_revision="$(
            az containerapp show \
              --name "$WORKER_CONTAINER_APP_NAME" \
              --resource-group "$WORKER_RESOURCE_GROUP" \
              --query properties.latestRevisionName \
              --output tsv
          )"
          if [[ "$provisioning_state" != "Succeeded" || -z "$latest_revision" ]]; then
            echo "::error::Worker Container App did not produce a successful revision."
            exit 1
          fi
